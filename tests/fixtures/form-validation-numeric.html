<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>form-validation-numeric</title>
<style>
body { margin: 0; font: 16px/1.4 sans-serif; }
input { display: block; width: 240px; margin: 8px; }
input:out-of-range { outline: 2px solid orange; }
input:in-range { outline: 2px solid green; }
input:invalid { border: 2px solid red; }
#result { white-space: pre; }
</style>
</head>
<body>
<form id="f" action="/submit" method="get">
<input id="code" name="code" pattern="[a-z]+" required>
<input id="age" name="age" type="number" min="1" max="120" required>
<input id="level" name="level" type="range" min="0" max="10" value="5">
<button type="submit">Send</button>
</form>
<pre id="result"></pre>
<script>
// Self-drive mode for headless-Chrome comparison (?drive=1).
(function () {
  var out = document.getElementById('result');
  function note(text) { out.textContent += text + '\n'; }
  if (!new URLSearchParams(location.search).has('drive')) { note('idle'); return; }
  var form = document.getElementById('f');
  var code = document.getElementById('code');
  var age = document.getElementById('age');
  var level = document.getElementById('level');
  var submits = 0;
  form.addEventListener('submit', function (event) {
    submits++;
    event.preventDefault();
    var data = new FormData(form);
    note('submit-body:' + data.get('code') + ',' + data.get('age') + ',' + data.get('level'));
  });
  function snap(label) {
    note(label + ':submits=' + submits +
      ':code-invalid=' + code.matches(':invalid') +
      ':age-out=' + age.matches(':out-of-range') + ':age-bad=' + age.validity.badInput +
      ':level-in=' + level.matches(':in-range') +
      ':form-invalid=' + form.matches(':invalid'));
  }
  code.value = 'ABC';
  age.value = '200';
  form.requestSubmit();
  snap('blocked');
  code.value = 'abc';
  age.value = '30';
  form.requestSubmit();
  snap('valid');
  note('done');
})();
</script>
</body>
</html>
