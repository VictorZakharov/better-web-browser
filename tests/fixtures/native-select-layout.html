<!doctype html>
<meta charset="utf-8">
<title>Native select layout and node comparison</title>
<style>
  body { margin: 24px; font: 16px/24px Arial, sans-serif }
  form { width: 600px }
  .filters { display: flex; gap: 20px; margin-bottom: 24px }
  .clip { width: 150px; overflow: hidden }
  select { display: block; position: relative; width: 140%; height: 32px;
    font: 16px/24px Arial, sans-serif; box-sizing: border-box; padding: 2px 4px }
  #results { border-top: 1px solid #ccc }
</style>
<form>
  <div class="filters">
    <div class="clip"><select name="region"><option value="all">All regions</option>
      <optgroup label="Regions"><option value="ca">Canada</option>
      <option value="de">Germany</option><option value="jp">Japan</option></optgroup>
    </select></div>
    <div class="clip"><select name="time"><option value="all">Any time</option>
      <option value="d">Past day</option><option value="m">Past month</option>
      <option value="y">Past year</option></select></div>
  </div>
  <section id="results"><h2>Results stay below compact native filters</h2>
    <p>Option text must not escape into the document flow.</p></section>
</form>
<pre id="status">Pending</pre>
<textarea id="query" placeholder="Type to test native editing"></textarea>
<pre id="editing">No user edit yet</pre>
<svg width="120" height="40" style="color:blue" aria-label="Red, blue, yellow color test">
  <rect width="40" height="40" fill="red" />
  <rect x="40" width="40" height="40" fill="currentColor" />
  <rect x="80" width="40" height="40" fill="currentColor" style="color:yellow" />
</svg>
<script>
  const check=(ok,label)=>{if(!ok)throw Error(label)};
  const a=document.createElement('meta'), b=document.createElement('meta');
  a.setAttribute('name','description');a.setAttribute('content','same');
  b.setAttribute('content','same');b.setAttribute('name','description');
  check(a.isEqualNode(b),'unordered attributes');
  b.setAttribute('content','different');check(!a.isEqualNode(b),'attribute value');
  check(a.isSameNode(a) && !a.isSameNode(b),'identity');
  const frame=document.createElement('iframe');document.body.append(frame);
  const remote=frame.contentDocument.createElement('meta');
  remote.setAttribute('name','description');remote.setAttribute('content','same');
  check(a.isEqualNode(remote),'cross-realm node');
  check(a.getAttributeNode('name').isEqualNode(remote.getAttributeNode('name')),'cross-realm Attr');
  frame.remove();
  const field=document.querySelector('#query');
  const descriptor=Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value');
  let tracked='', changed=false;
  Object.defineProperty(field,'value',{
    get(){return descriptor.get.call(this)},
    set(value){tracked=String(value);descriptor.set.call(this,value)}
  });
  field.addEventListener('input',()=>{changed=field.value!==tracked});
  field.addEventListener('keydown',event=>{
    if(event.key!=='Enter')return;
    event.preventDefault();
    document.querySelector('#editing').textContent=changed && field.value==='standards search' ? 'EDIT PASS' : 'EDIT FAIL';
  });
  requestAnimationFrame(()=>{
    for(const select of document.querySelectorAll('select'))
      check(select.getBoundingClientRect().height===32,'control height');
    check(document.querySelector('#results').getBoundingClientRect().top<100,'no option spill');
    document.querySelector('#status').textContent='PASS';
  });
</script>
