<!doctype html>
<style>
  html, body { margin: 0; min-height: 2400px; }
  #pad { width: 200px; height: 100px; background: red; color: black; }
  #pad:hover { background: rgb(0,128,0); color: white; text-decoration: underline; }
  /* Exercise the supported inline decoration directly, not block propagation. */
  #pad:hover span { text-decoration: underline; }
  #outside { position: absolute; left: 300px; top: 0; width: 200px; height: 100px; }
</style>
<body id=page>
<div id=pad><span>coalesced hover</span></div><div id=outside></div>
<script>
  const pad = document.getElementById('pad');
  let moves = 0;
  document.addEventListener('mousemove', event => {
    ++moves;
    console.log('MOVE:' + moves + ':' + event.target.id + ':' +
      pad.getBoundingClientRect().width + ':' + getComputedStyle(pad).backgroundColor +
      ':SPAN_DECORATION:' + getComputedStyle(pad.firstElementChild).textDecorationLine +
      ':' + getComputedStyle(pad.firstElementChild).getPropertyValue('text-decoration'));
  });
  document.addEventListener('wheel', event => {
    console.log('WHEEL:' + moves + ':' + event.deltaY);
    if (event.deltaY < 0) event.preventDefault();
  }, { passive: false });
</script>
