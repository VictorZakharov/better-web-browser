<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>form-validation-owners</title>
<style>
body { margin: 0; font: 16px/1.4 sans-serif; }
form:invalid { outline: 2px solid red; }
form:valid { outline: 2px solid green; }
#result { white-space: pre; }
</style>
</head>
<body>
<form id="a" action="/submit-a" method="get">
<fieldset id="s"><input id="a1" name="a1" required></fieldset>
</form>
<form id="b" action="/submit-b" method="get"></form>
<input id="ext" name="ext" form="b" required>
<iframe id="child" srcdoc="<form id=c action=/submit-c method=get><input id=c1 name=c1 required></form>"></iframe>
<pre id="result"></pre>
<script>
// Self-drive mode for headless-Chrome comparison (?drive=1).
(function () {
  var out = document.getElementById('result');
  function note(text) { out.textContent += text + '\n'; }
  if (!new URLSearchParams(location.search).has('drive')) { note('idle'); return; }
  var a = document.getElementById('a');
  var b = document.getElementById('b');
  var a1 = document.getElementById('a1');
  var ext = document.getElementById('ext');
  var submits = [];
  function watch(form) {
    form.addEventListener('submit', function (event) {
      submits.push(form.id);
      event.preventDefault();
    });
  }
  watch(a);
  watch(b);
  var before = [a.matches(':invalid'), b.matches(':invalid'),
    document.getElementById('s').matches(':invalid')].join(',');
  a1.value = 'x';
  ext.value = 'y';
  var after = [a.matches(':valid'), b.matches(':valid')].join(',');
  a.requestSubmit();
  b.requestSubmit();
  note('before:' + before);
  note('after:' + after);
  note('submits:' + submits.join(','));
  // The srcdoc child settles with the parent load event; dump-dom captures after load.
  window.addEventListener('load', function () {
    var childForm = document.getElementById('child').contentDocument.getElementById('c');
    note('child:' + childForm.matches(':invalid'));
    note('done');
  });
})();
</script>
</body>
</html>
