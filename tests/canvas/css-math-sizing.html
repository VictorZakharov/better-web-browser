<!doctype html>
<meta charset="utf-8">
<title>CSS math, containing blocks and SVG sizing</title>
<style>
body { margin: 0; font-size: 16px }
.case { background: #4682b4; height: 20px; margin-bottom: 2px }
#parent { width: 400px; height: 120px }
#percent { width: min(50%, 300px) }
#viewport { width: min(50vw, 300px) }
#clamped { width: clamp(100px, 50%, 250px) }
#height { width: 40px; height: clamp(20px, 50%, 100px) }
#logo { position: relative; width: min(620px, 88vw); height: auto; aspect-ratio: 700 / 330 }
#logo svg { position: absolute; inset: 0; width: 100%; height: 100% }
#reversed { width: clamp(200px, 10px, 100px) }
#invalid { width: 80px; width: min(10px, 1) }
</style>
<div id="parent">
  <div id="percent" class="case"></div>
  <div id="viewport" class="case"></div>
  <div id="clamped" class="case"></div>
  <div id="height" class="case"></div>
</div>
<div id="logo" class="case"><svg viewBox="0 0 700 330"><rect width="700" height="330" fill="#4682b4"/></svg></div>
<div id="reversed" class="case"></div>
<div id="invalid" class="case"></div>
