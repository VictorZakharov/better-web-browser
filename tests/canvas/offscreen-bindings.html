<!doctype html>
<meta charset="utf-8">
<title>OffscreenCanvas ownership and Web IDL bindings</title>
<output id="probe">Running</output>
<script src="offscreen-bindings.js"></script>
<script>
try {
    const result = testOffscreenBindings();
    probe.setAttribute('data-result', JSON.stringify(result));
    probe.textContent = 'Complete';
} catch (error) {
    probe.setAttribute('data-error', String(error));
    probe.textContent = String(error);
}
</script>
