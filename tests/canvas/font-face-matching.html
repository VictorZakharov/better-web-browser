<!doctype html>
<meta charset="utf-8">
<title>FontFaceSet shared CSS query matching</title>
<pre id="probe" data-result="pending"></pre>
<script src="font-face-matching.js"></script>
<script>
fetch('fonts/ahem.ttf').then(response=>response.arrayBuffer())
    .then(buffer=>testFontFaceMatching(new Uint8Array(buffer)))
    .then(result=>{probe.setAttribute('data-result',result);probe.textContent=result;},
        error=>{probe.setAttribute('data-result',String(error));probe.textContent=String(error);});
</script>
