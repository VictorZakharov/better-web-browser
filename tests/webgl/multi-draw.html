<!doctype html><meta charset="utf-8"><title>Native multi-draw and capture</title>
<canvas id="canvas" width="4" height="4"></canvas><pre id="probe"></pre>
<script>
const canvas=document.querySelector('canvas'),probe=document.querySelector('#probe');
const gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
const ext=gl&&gl.getExtension('WEBGL_multi_draw');
if(!ext){probe.dataset.result='unavailable';}else{
 const samples={};
 const compile=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;};
 const p=gl.createProgram();
 gl.attachShader(p,compile(gl.VERTEX_SHADER,'#version 300 es\n#extension GL_ANGLE_multi_draw : require\nflat out int draw;out float captured;void main(){draw=gl_DrawID;captured=float(draw+1);gl_Position=vec4(float(draw)*0.5-0.75,0.25,0,1);gl_PointSize=1.0;}'));
 gl.attachShader(p,compile(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;flat in int draw;out vec4 color;void main(){color=draw==0?vec4(1,0,0,1):draw==1?vec4(0,1,0,1):vec4(0,0,1,1);}'));
 gl.transformFeedbackVaryings(p,['captured'],gl.INTERLEAVED_ATTRIBS);gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);
 const pixel=x=>{const d=new Uint8Array(4);gl.readPixels(x,2,1,1,gl.RGBA,gl.UNSIGNED_BYTE,d);return Array.from(d);};
 ext.multiDrawArraysWEBGL(gl.POINTS,[0,0,0],0,[0,1,1],0,3);
 samples.empty=[pixel(0),pixel(1),pixel(2)];
 gl.drawArrays(gl.POINTS,0,1);samples.ordinary=pixel(0);
 gl.clear(gl.COLOR_BUFFER_BIT);
 ext.multiDrawArraysWEBGL(gl.POINTS,[0,-1],0,[1,1],0,2);
 samples.lateError=gl.getError();samples.afterInvalid=pixel(0);
 const firsts=new Int32Array([0]),counts=new Int32Array([0]);
 ext.multiDrawArraysWEBGL(gl.POINTS,firsts,0,counts,{valueOf(){counts[0]=1;return 0;}},1);
 samples.lateMutation=pixel(0);
 samples.sourceAfterGetter=counts[0];
 const buffer=gl.createBuffer();gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER,buffer);
 gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER,8,gl.STATIC_DRAW);
 gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER,0,buffer);gl.enable(gl.RASTERIZER_DISCARD);
 gl.beginTransformFeedback(gl.POINTS);
 ext.multiDrawArraysWEBGL(gl.POINTS,[0,0,0],0,[1,1,1],0,3);
 samples.overflow=gl.getError();
 ext.multiDrawArraysWEBGL(gl.POINTS,[0,0],0,[1,1],0,2);
 samples.captureError=gl.getError();gl.endTransformFeedback();
 const captured=new Float32Array(2);gl.getBufferSubData(gl.TRANSFORM_FEEDBACK_BUFFER,0,captured);
 samples.captured=Array.from(captured);samples.error=gl.getError();
 probe.dataset.samples=JSON.stringify(samples);probe.dataset.result='complete';
 probe.textContent='Native multi-draw comparison complete';
}
</script>
