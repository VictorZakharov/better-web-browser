<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<style>body{font:16px sans-serif;margin:24px}canvas{width:160px;height:160px;image-rendering:pixelated}pre{white-space:pre-wrap}</style>
<canvas width="4" height="4"></canvas>
<pre id="results">Checking repeated image definition and native sampling</pre>
<script>
(() => {
    const results = document.querySelector('#results'), passed = [];
    const assert = (value, label) => {
        if (!value) throw Error(label);
        passed.push(label);
    };
    try {
        const canvas = document.querySelector('canvas');
        const gl = canvas.getContext('webgl', {preserveDrawingBuffer:true, antialias:false});
        assert(gl, 'native WebGL context');
        const error = (code, label) => assert(gl.getError() === code, label);
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        const definition = (size, bytes) => {
            gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,size,size,0,gl.RGBA,gl.UNSIGNED_BYTE,bytes);
        };
        // The former whole-image charge consumes over 64 MiB across this loop,
        // despite the author only retaining one 64 KiB texture image.
        for (let index=0; index<600; index++) {
            definition(128,null);
            if (index%100===99) error(0,'redefinition group '+Math.floor(index/100));
        }
        assert(!gl.isContextLost(), 'redefinition preserves context');
        // Regeneration must reserve each mip once, not add the chain repeatedly.
        definition(256,null);
        for (let index=0; index<600; index++) {
            gl.generateMipmap(gl.TEXTURE_2D);
            if (index%100===99) error(0,'mip regeneration group '+Math.floor(index/100));
        }
        // High-water accounting must survive shrink/regrow without accumulating
        // another charge for a previously reserved mip image.
        for (let index=0; index<100; index++) {
            definition(64,null);
            gl.generateMipmap(gl.TEXTURE_2D);
            definition(256,null);
            gl.generateMipmap(gl.TEXTURE_2D);
        }
        error(0,'mip shrink and regrow');
        const shader = (kind, source) => {
            const shader = gl.createShader(kind);
            gl.shaderSource(shader,source);
            gl.compileShader(shader);
            assert(gl.getShaderParameter(shader,gl.COMPILE_STATUS),gl.getShaderInfoLog(shader));
            return shader;
        };
        const program = gl.createProgram();
        gl.attachShader(program,shader(gl.VERTEX_SHADER,
            'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}'));
        gl.attachShader(program,shader(gl.FRAGMENT_SHADER,
            'precision highp float;uniform sampler2D t;void main(){gl_FragColor=texture2D(t,vec2(0.5));}'));
        gl.bindAttribLocation(program,0,'p');
        gl.linkProgram(program);
        assert(gl.getProgramParameter(program,gl.LINK_STATUS),gl.getProgramInfoLog(program));
        gl.useProgram(program);
        gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
        gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
        gl.enableVertexAttribArray(0);
        const sample = (expected, label) => {
            gl.drawArrays(gl.TRIANGLES,0,3);
            error(0,label+' draw');
            const pixels = new Uint8Array(64);
            gl.readPixels(0,0,4,4,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
            error(0,label+' read');
            assert(pixels.every((value,index)=>value===expected[index%4]),label+' pixels');
        };
        const green = new Uint8Array(4*4*4);
        for (let index=0; index<green.length; index+=4) {
            green[index+1]=255;
            green[index+3]=255;
        }
        definition(4,green);
        sample([0,255,0,255],'upload after repetitions');
        for (let index=0; index<600; index++) {
            gl.copyTexImage2D(gl.TEXTURE_2D,0,gl.RGBA,0,0,4,4,0);
        }
        error(0,'repeated copies');
        sample([0,255,0,255],'copy retains source color');
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,-1,4,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
        error(gl.INVALID_VALUE,'invalid replacement');
        sample([0,255,0,255],'failed replacement retains image');
        const compressed = gl.getExtension('WEBGL_compressed_texture_s3tc');
        assert(compressed,'complete native S3TC family');
        const red = new Uint8Array([0,248,0,0,0,0,0,0]);
        for (let index=0; index<600; index++) {
            gl.compressedTexImage2D(gl.TEXTURE_2D,0,compressed.COMPRESSED_RGBA_S3TC_DXT1_EXT,4,4,0,red);
        }
        error(0,'compressed redefinition');
        sample([255,0,0,255],'compressed image after repetitions');
        definition(4,green);
        error(0,'compressed to normalized replacement');
        sample([0,255,0,255],'normalized replacement');
        results.textContent=passed.join('\n');
        results.dataset.count=String(passed.length);
        document.title='ready:'+passed.length;
    } catch (error) {
        document.title='failed:'+error.message;
        results.textContent=document.title;
        results.dataset.count='0';
        results.dataset.error=error.message;
    }
    document.documentElement.dataset.fixtureReady='true';
})();
</script>
