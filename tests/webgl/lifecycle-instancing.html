<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<style>
body { margin:24px; background:white; color:black; font:16px sans-serif }
canvas { width:256px; height:128px; image-rendering:pixelated; display:block }
pre { white-space:pre-wrap }
</style>
<canvas width="8" height="4"></canvas>
<pre id="results">Running WebGL lifecycle and native pixel checks</pre>
<script>
(() => {
    const canvas=document.querySelector('canvas');
    const results=document.querySelector('#results');
    const gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,stencil:true,antialias:false});
    const passed=[];
    const assert=(condition,label)=>{
        if(!condition) throw Error(label);
        passed.push(label);
    };
    const fail=error=>{
        document.title='failed:'+error.message;
        results.textContent=document.title;
        results.dataset.count='0';
        document.documentElement.dataset.fixtureReady='true';
    };
    const pixel=(x,y)=>{
        const bytes=new Uint8Array(4);
        gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,bytes);
        return String(bytes);
    };
    const compile=(kind,source)=>{
        const shader=gl.createShader(kind);
        gl.shaderSource(shader,source);gl.compileShader(shader);
        assert(gl.getShaderParameter(shader,gl.COMPILE_STATUS),gl.getShaderInfoLog(shader));
        assert(gl.getShaderSource(shader)===source,'author shader source retained');
        return shader;
    };
    const draw=()=>{
        const instancing=gl.getExtension('ANGLE_instanced_arrays');
        const arrays=gl.getExtension('OES_vertex_array_object');
        assert(instancing && arrays,'native geometry extensions available');
        const vao=arrays.createVertexArrayOES();arrays.bindVertexArrayOES(vao);
        const program=gl.createProgram();
        gl.attachShader(program,compile(gl.VERTEX_SHADER,
            'attribute vec2 p;attribute vec2 offset;uniform vec4 color;varying vec4 tint;'+
            'void main(){gl_Position=vec4(p+offset,0.,1.);tint=color;}'));
        gl.attachShader(program,compile(gl.FRAGMENT_SHADER,
            'precision mediump float;varying vec4 tint;void main(){gl_FragColor=tint;}'));
        gl.bindAttribLocation(program,0,'p');gl.bindAttribLocation(program,1,'offset');
        gl.linkProgram(program);assert(gl.getProgramParameter(program,gl.LINK_STATUS),'native program linked');
        gl.useProgram(program);
        const color=gl.getUniformLocation(program,'color');gl.uniform4fv(color,[0,1,0,1]);
        assert(String(gl.getUniform(program,color))==='0,1,0,1','native uniform reflected');
        const vertices=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vertices);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-.9,-.9,-.1,-.9,-.9,.9,-.1,.9]),gl.STATIC_DRAW);
        gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);
        const offsets=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,offsets);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0]),gl.STATIC_DRAW);
        gl.vertexAttribPointer(1,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(1);
        instancing.vertexAttribDivisorANGLE(1,1);
        assert(gl.getVertexAttrib(1,instancing.VERTEX_ATTRIB_ARRAY_DIVISOR_ANGLE)===1,'VAO captured divisor');
        const elements=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,elements);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,3]),gl.STATIC_DRAW);
        instancing.drawElementsInstancedANGLE(gl.TRIANGLE_STRIP,4,gl.UNSIGNED_SHORT,0,2);
        assert(pixel(1,1)==='0,255,0,255' && pixel(6,1)==='0,255,0,255','two native instances painted');
        arrays.bindVertexArrayOES(null);
        assert(gl.getParameter(gl.ELEMENT_ARRAY_BUFFER_BINDING)===null,'default VAO has independent elements');
        arrays.bindVertexArrayOES(vao);
        assert(gl.getParameter(gl.ELEMENT_ARRAY_BUFFER_BINDING)===elements,'VAO restored elements');
        // Native robust-access implementations may accept out-of-range vertices.
        // A misaligned ushort index offset is invalid in every WebGL 1 backend.
        instancing.drawElementsInstancedANGLE(gl.TRIANGLE_STRIP,4,gl.UNSIGNED_SHORT,1,2);
        assert(gl.getError()===gl.INVALID_OPERATION,'misaligned index offset rejected');
        assert(pixel(1,1)==='0,255,0,255','invalid draw retained earlier pixels');
        gl.stencilMaskSeparate(gl.FRONT,0xdeadbeef);gl.stencilMaskSeparate(gl.BACK,0xf1234567);
        assert(gl.getParameter(gl.STENCIL_WRITEMASK)===0xdeadbeef,'unsigned front stencil mask');
        assert(gl.getParameter(gl.STENCIL_BACK_WRITEMASK)===0xf1234567,'unsigned back stencil mask');
        assert(gl.getError()===0,'native geometry leaves no errors');
        return {program,vao,instancing,arrays,vertices};
    };
    try {
        assert(gl,'real WebGL context created');
        const old=draw();
        const lose=gl.getExtension('WEBGL_lose_context');
        assert(lose,'context loss extension available');
        canvas.addEventListener('webglcontextlost',event=>{
            try {
                assert(event.isTrusted && event.cancelable,'trusted cancelable loss event');
                event.preventDefault();
                assert(gl.isContextLost(),'context lost immediately');
                assert(gl.getError()===gl.CONTEXT_LOST_WEBGL && gl.getError()===0,'single loss error');
                assert(gl.getExtension('ANGLE_instanced_arrays')===null,'extensions unavailable while lost');
                setTimeout(()=>lose.restoreContext(),0);
            } catch(error) { fail(error); }
        });
        canvas.addEventListener('webglcontextrestored',event=>{
            try {
                assert(event.isTrusted && event.cancelable,'trusted cancelable restoration event');
                assert(!gl.isContextLost(),'real context restored');
                assert(pixel(1,1)==='0,0,0,0','restoration zeroed drawing buffer');
                assert(gl.getParameter(gl.CURRENT_PROGRAM)===null,'restoration reset program');
                assert(gl.getParameter(gl.STENCIL_WRITEMASK)===0xffffffff,'restoration reset mask');
                gl.bindBuffer(gl.ARRAY_BUFFER,old.vertices);
                assert(gl.getError()===gl.INVALID_OPERATION,'old resource cannot alias restored context');
                const current=draw();
                assert(current.instancing!==old.instancing && current.arrays!==old.arrays,'extension identities renewed');
                old.instancing.vertexAttribDivisorANGLE(1,7);
                assert(gl.getVertexAttrib(1,current.instancing.VERTEX_ATTRIB_ARRAY_DIVISOR_ANGLE)===1,'old extension cannot alter new context');
                const copy=document.createElement('canvas');copy.width=8;copy.height=4;
                const context=copy.getContext('2d');context.drawImage(canvas,0,0);
                assert(String(context.getImageData(1,1,1,1).data)==='0,255,0,255','restored WebGL copies into Canvas 2D');
                document.title='webgl passed';
                results.textContent=passed.map(label=>'PASS '+label).join('\n');
                results.dataset.count=String(passed.length);
                document.documentElement.dataset.fixtureReady='true';
            } catch(error) { fail(error); }
        });
        lose.loseContext();
    } catch(error) { fail(error); }
})();
</script>
