<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<style>body{font:16px sans-serif;margin:24px;background:white;color:black}canvas{display:block;width:256px;height:128px;image-rendering:pixelated}pre{white-space:pre-wrap}</style>
<canvas width="8" height="4"></canvas>
<pre id="results">Running native multiple-render-target checks</pre>
<script>
(() => {
    const results=document.querySelector('#results'), passed=[];
    const assert=(value,label)=>{if(!value)throw Error(label);passed.push(label)};
    try {
        const canvas=document.querySelector('canvas'), gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
        assert(gl,'WebGL1 context');
        const ext=gl.getExtension('WEBGL_draw_buffers');assert(ext,'multiple render targets');
        const error=(code,label)=>assert(gl.getError()===code,label);
        assert(gl.getParameter(ext.MAX_DRAW_BUFFERS_WEBGL)>=4,'at least four outputs');
        assert(gl.getParameter(ext.MAX_COLOR_ATTACHMENTS_WEBGL)>=gl.getParameter(ext.MAX_DRAW_BUFFERS_WEBGL),'attachment capacity');
        const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
        const images=[];
        for(let i=0;i<4;i++) {
            const image=gl.createTexture();images.push(image);gl.bindTexture(gl.TEXTURE_2D,image);
            gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,2,2,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
            gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
            gl.framebufferTexture2D(gl.FRAMEBUFFER,ext.COLOR_ATTACHMENT0_WEBGL+i,gl.TEXTURE_2D,image,0);
            assert(gl.getFramebufferAttachmentParameter(gl.FRAMEBUFFER,ext.COLOR_ATTACHMENT0_WEBGL+i,gl.FRAMEBUFFER_ATTACHMENT_OBJECT_NAME)===image,'attachment identity '+i);
        }
        assert(gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE,'four complete images');
        ext.drawBuffersWEBGL(images.map((_,i)=>ext.COLOR_ATTACHMENT0_WEBGL+i));error(0,'routing');
        const shader=(kind,source)=>{const s=gl.createShader(kind);gl.shaderSource(s,source);gl.compileShader(s);
            assert(gl.getShaderParameter(s,gl.COMPILE_STATUS),gl.getShaderInfoLog(s));return s;};
        const program=gl.createProgram();
        gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}'));
        gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'#extension GL_EXT_draw_buffers : require\nprecision mediump float;void main(){gl_FragData[0]=vec4(1,0,0,1);gl_FragData[1]=vec4(0,1,0,1);gl_FragData[2]=vec4(0,0,1,1);gl_FragData[3]=vec4(1);}'));
        gl.bindAttribLocation(program,0,'p');gl.linkProgram(program);
        assert(gl.getProgramParameter(program,gl.LINK_STATUS),gl.getProgramInfoLog(program));gl.useProgram(program);
        gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
        gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);error(0,'native MRT draw');
        ext.drawBuffersWEBGL([ext.COLOR_ATTACHMENT1_WEBGL]);error(gl.INVALID_OPERATION,'invalid route rejected');
        assert(gl.getParameter(ext.DRAW_BUFFER1_WEBGL)===ext.COLOR_ATTACHMENT1_WEBGL,'invalid route preserves state');
        const expected=['255,0,0,255','0,255,0,255','0,0,255,255','255,255,255,255'];
        const inspect=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,inspect);
        for(let i=0;i<4;i++) {
            gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,images[i],0);
            const bytes=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,bytes);
            error(0,'target read '+i);assert(String(bytes)===expected[i],'native color '+i);
        }
        gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER,ext.COLOR_ATTACHMENT1_WEBGL,gl.TEXTURE_2D,images[0],0);
        assert(gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_UNSUPPORTED,'aliased image rejected');
        gl.clear(gl.COLOR_BUFFER_BIT);error(gl.INVALID_FRAMEBUFFER_OPERATION,'invalid target cannot be painted');
        gl.bindFramebuffer(gl.FRAMEBUFFER,null);
        assert(gl.getParameter(ext.DRAW_BUFFER0_WEBGL)===gl.BACK,'private surface maps to BACK');
        gl.clearColor(0,1,0,1);gl.clear(gl.COLOR_BUFFER_BIT);error(0,'default native image');
        results.textContent=passed.join('\n');results.dataset.count=String(passed.length);document.title='ready:'+passed.length;
    } catch(error) {
        document.title='failed:'+error.message;results.textContent=document.title;results.dataset.count='0';results.dataset.error=error.message;
    }
    document.documentElement.dataset.fixtureReady='true';
})();
</script>
