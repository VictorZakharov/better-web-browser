<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<style>body{font:16px sans-serif;margin:24px}canvas{width:160px;height:160px;image-rendering:pixelated}pre{white-space:pre-wrap}</style>
<canvas width="4" height="4"></canvas>
<pre id="results">Checking native block texture decoding</pre>
<script>
(() => {
    const results = document.querySelector('#results'), passed = [];
    const assert = (value, label) => {
        if (!value) throw Error(label);
        passed.push(label);
    };
    try {
        const canvas = document.querySelector('canvas');
        const gl = canvas.getContext('webgl', {preserveDrawingBuffer:true, antialias:false});
        assert(gl, 'WebGL1 context');
        const error = (code, label) => assert(gl.getError() === code, label);
        const formats = [
            ['WEBGL_compressed_texture_s3tc', [0x83f0,0x83f1,0x83f2,0x83f3]],
            ['WEBGL_compressed_texture_s3tc_srgb', [0x8c4c,0x8c4d,0x8c4e,0x8c4f]],
            ['EXT_texture_compression_rgtc', [0x8dbb,0x8dbc,0x8dbd,0x8dbe]]
        ];
        assert(gl.getParameter(gl.COMPRESSED_TEXTURE_FORMATS) instanceof Uint32Array, 'typed format query');
        const initial = [...gl.getParameter(gl.COMPRESSED_TEXTURE_FORMATS)];
        assert(initial.length === 0, 'no unrequested formats');
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        const shader = (kind, source) => {
            const shader = gl.createShader(kind);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            assert(gl.getShaderParameter(shader,gl.COMPILE_STATUS), gl.getShaderInfoLog(shader));
            return shader;
        };
        const program = gl.createProgram();
        gl.attachShader(program, shader(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}'));
        gl.attachShader(program, shader(gl.FRAGMENT_SHADER,
            'precision highp float;uniform sampler2D t;uniform vec2 uv;void main(){gl_FragColor=texture2D(t,uv);}'));
        gl.bindAttribLocation(program,0,'p');
        gl.linkProgram(program);
        assert(gl.getProgramParameter(program,gl.LINK_STATUS), gl.getProgramInfoLog(program));
        gl.useProgram(program);
        gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
        gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
        gl.enableVertexAttribArray(0);
        const uv = gl.getUniformLocation(program,'uv');
        const sample = (x, expected, label) => {
            gl.uniform2f(uv,x,0.5);
            gl.drawArrays(gl.TRIANGLES,0,3);
            error(0,label+' draw');
            const pixels = new Uint8Array(64);
            gl.readPixels(0,0,4,4,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
            error(0,label+' read');
            assert(pixels.every((value,index)=>Math.abs(value-expected[index%4])<=1),label+' decoded pixels');
        };
        const block = (format, color=0xf800) => {
            const colors = [color&255,color>>8,0,0,0,0,0,0];
            if ([0x83f0,0x83f1,0x8c4c,0x8c4d].includes(format)) return new Uint8Array(colors);
            if ([0x83f2,0x8c4e].includes(format)) return new Uint8Array([...Array(8).fill(255),...colors]);
            if ([0x83f3,0x8c4f].includes(format)) return new Uint8Array([255,0,0,0,0,0,0,0,...colors]);
            if (format===0x8dbb) return new Uint8Array([255,0,0,0,0,0,0,0]);
            if (format===0x8dbc) return new Uint8Array([127,128,0,0,0,0,0,0]);
            if (format===0x8dbd) return new Uint8Array([255,0,0,0,0,0,0,0,128,0,0,0,0,0,0,0]);
            return new Uint8Array([127,128,0,0,0,0,0,0,64,128,0,0,0,0,0,0]);
        };
        gl.compressedTexImage2D(gl.TEXTURE_2D,0,0x83f1,4,4,0,block(0x83f1));
        error(gl.INVALID_ENUM,'disabled format rejected');
        const expectedFormats = [];
        for (const [name, family] of formats) {
            assert(gl.getSupportedExtensions().includes(name),name+' available');
            const extension = gl.getExtension(name);
            assert(extension,name+' admitted');
            assert(extension===gl.getExtension(name.toUpperCase()),name+' cached identity');
            assert(typeof globalThis[name]==='undefined',name+' no global constructor');
            const constants = Object.keys(Object.getPrototypeOf(extension)).map(key=>extension[key]);
            assert(family.every(value=>constants.includes(value)),name+' constants');
            expectedFormats.push(...family);
            const actual = [...gl.getParameter(gl.COMPRESSED_TEXTURE_FORMATS)];
            assert(actual.length===expectedFormats.length && expectedFormats.every(value=>actual.includes(value)),name+' exact format admission');
            for (const format of family) {
                const data = block(format);
                // Exercise a view with unrelated prefix/suffix bytes.
                const storage = new Uint8Array(data.length+8);
                storage.fill(91);storage.set(data,4);
                gl.compressedTexImage2D(gl.TEXTURE_2D,0,format,4,4,0,storage.subarray(4,4+data.length));
                error(0,'format '+format+' upload');
                sample(0.5,[255,format===0x8dbd||format===0x8dbe?128:0,0,255],'format '+format);
                gl.compressedTexImage2D(gl.TEXTURE_2D,0,format,4,4,0,new Uint8Array(data.length-1));
                error(gl.INVALID_VALUE,'short block '+format);
            }
        }
        const red = block(0x83f1), green = block(0x83f1,0x07e0);
        gl.compressedTexImage2D(gl.TEXTURE_2D,0,0x83f1,8,4,0,new Uint8Array([...red,...red]));
        error(0,'two block allocation');
        gl.compressedTexSubImage2D(gl.TEXTURE_2D,0,4,0,4,4,0x83f1,green);
        error(0,'aligned block update');
        sample(0.25,[255,0,0,255],'untouched neighbor');
        sample(0.75,[0,255,0,255],'updated block');
        gl.compressedTexSubImage2D(gl.TEXTURE_2D,0,1,0,4,4,0x83f1,green);
        error(gl.INVALID_OPERATION,'misaligned update');
        gl.compressedTexSubImage2D(gl.TEXTURE_2D,0,8,0,4,4,0x83f1,green);
        error(gl.INVALID_VALUE,'out of bounds update');
        sample(0.25,[255,0,0,255],'failed update preserves neighbor');
        gl.generateMipmap(gl.TEXTURE_2D);
        error(gl.INVALID_OPERATION,'compressed mip generation rejected');
        gl.compressedTexImage2D(gl.TEXTURE_2D,0,0x8c4d,4,4,0,block(0x8c4d,0x8410));
        error(0,'sRGB gray upload');
        sample(0.5,[59,57,59,255],'sRGB linear decoding');
        results.textContent = passed.join('\n');
        results.dataset.count = String(passed.length);
        document.title = 'ready:'+passed.length;
    } catch (error) {
        document.title = 'failed:'+error.message;
        results.textContent = document.title;
        results.dataset.count = '0';results.dataset.error = error.message;
    }
    document.documentElement.dataset.fixtureReady = 'true';
})();
</script>
