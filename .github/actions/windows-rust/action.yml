name: Windows Rust dependencies
description: Restore compiler and registry caches without caching workspace build outputs
inputs:
  populate-source-cache:
    description: Let one worker populate a missing source cache without delaying every cold worker
    default: 'false'
runs:
  using: composite
  steps:
    - name: Configure compiler cache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.17.0
    - name: Restore Cargo registry cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
        key: windows-cargo-registry-v4-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          windows-cargo-registry-v4-
    # Registry sources have many small files (V8 alone has over 15,000). Restore
    # independent bundles in parallel instead of serial Cargo/MSYS extraction.
    - name: Restore Cargo source bundles
      id: sources
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/cargo-source-bundles
        key: windows-cargo-sources-parallel-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/cargo-source-cache.ps1') }}
    - name: Expand Cargo sources concurrently
      if: steps.sources.outputs.cache-hit == 'true'
      shell: pwsh
      run: ./scripts/cargo-source-cache.ps1 -Mode Restore -SourceDirectory (Join-Path $env:USERPROFILE '.cargo/registry/src') -ArchiveDirectory (Join-Path $env:RUNNER_TEMP 'cargo-source-bundles')
    - name: Prepare V8 build path
      shell: pwsh
      run: ./scripts/prepare-v8.ps1 -Profile debug
    - name: Save Cargo source bundles
      if: inputs.populate-source-cache == 'true' && steps.sources.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./scripts/cargo-source-cache.ps1 -Mode Create -SourceDirectory (Join-Path $env:USERPROFILE '.cargo/registry/src') -ArchiveDirectory (Join-Path $env:RUNNER_TEMP 'cargo-source-bundles')
    - name: Publish Cargo source bundles
      if: inputs.populate-source-cache == 'true' && steps.sources.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/cargo-source-bundles
        key: ${{ steps.sources.outputs.cache-primary-key }}
