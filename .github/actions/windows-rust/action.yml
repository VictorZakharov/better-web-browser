name: Windows Rust dependencies
description: Restore compiler and registry caches without caching workspace build outputs
runs:
  using: composite
  steps:
    - name: Start pinned Rust setup alongside cache restore
      shell: pwsh
      run: |
        # The rustup proxy installs rust-toolchain.toml's version. Cargo below waits
        # on rustup's lock and reports any setup failure; no toolchain is unpinned.
        Start-Process -FilePath (Get-Command rustc).Source -ArgumentList '--version' -WindowStyle Hidden -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'rust-setup.stdout') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'rust-setup.stderr')
    - name: Configure compiler cache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.17.0
    - name: Restore Cargo registry cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
          ~/.cargo/registry/src
        key: windows-cargo-registry-v5-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          windows-cargo-registry-v5-
    - name: Prepare V8 build path
      shell: pwsh
      run: ./scripts/prepare-v8.ps1 -Profile debug
