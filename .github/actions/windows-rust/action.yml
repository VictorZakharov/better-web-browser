name: Windows Rust dependencies
description: Restore compiler and registry caches without caching workspace build outputs
inputs:
  populate-source-cache:
    description: Publish a missing source image from one worker only
    default: 'false'
runs:
  using: composite
  steps:
    - name: Configure compiler cache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.17.0
    - name: Configure cached native C++ compiler
      shell: pwsh
      run: ./scripts/prepare-native-cache.ps1
    - name: Restore Cargo registry cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
        key: windows-cargo-registry-v4-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          windows-cargo-registry-v4-
    # The locked ANGLE fork is a Git dependency, outside the registry image.
    - name: Restore Cargo Git sources
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/git/db
          ~/.cargo/git/checkouts
        key: windows-cargo-git-v1-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          windows-cargo-git-v1-
    # Keep the 24,000 small source files inside one filesystem image: extracting
    # them separately on every Windows VM dominates warm dependency preparation.
    - name: Restore Cargo source volume
      id: sources
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/cargo-source-volume/registry.vhdx
        key: windows-cargo-volume-v3-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/cargo-source-volume*.ps1') }}
        # v2 uses the same validated NTFS image layout; migrate without extraction.
        restore-keys: |
          windows-cargo-volume-v3-
          windows-cargo-volume-v2-
    - name: Mount Cargo source volume
      # A compatible older image avoids extracting every source after a lock edit.
      # Cargo adds missing locked packages before the new exact image is published.
      if: steps.sources.outputs.cache-matched-key != ''
      shell: pwsh
      run: ./scripts/cargo-source-volume.ps1 -Mode Mount
    - name: Create missing Cargo source volume
      if: steps.sources.outputs.cache-matched-key == ''
      shell: pwsh
      run: ./scripts/cargo-source-volume.ps1 -Mode Create
    - name: Prepare V8 build path
      shell: pwsh
      run: ./scripts/prepare-v8.ps1 -Profile debug
    - name: Check ANGLE binding compiler
      shell: pwsh
      run: ./scripts/prepare-angle.ps1
    - name: Flush Cargo source volume before caching
      if: inputs.populate-source-cache == 'true' && steps.sources.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./scripts/cargo-source-volume.ps1 -Mode Unmount
    - name: Publish Cargo source volume
      if: inputs.populate-source-cache == 'true' && steps.sources.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/cargo-source-volume/registry.vhdx
        key: ${{ steps.sources.outputs.cache-primary-key }}
    - name: Remount populated Cargo source volume
      if: inputs.populate-source-cache == 'true' && steps.sources.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./scripts/cargo-source-volume.ps1 -Mode Mount
