name: CI

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      run_windows: ${{ steps.classify.outputs.run_windows }}
      markdown_only: ${{ steps.classify.outputs.markdown_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether Windows workers are required
        id: classify
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $parameters = @{ GitHubOutputPath = $env:GITHUB_OUTPUT }
          if ($env:EVENT_NAME -eq 'pull_request') {
            $parameters.BaseSha = $env:BASE_SHA
            $parameters.HeadSha = $env:HEAD_SHA
          } else {
            $parameters.ForceFull = $true
          }
          ./scripts/classify-ci-changes.ps1 @parameters

  linear-history:
    name: Linear PR history
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject merge commits introduced by the pull request
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-linear-history.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA

  source:
    name: Source and formatting
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce source-file size
        shell: pwsh
        run: ./scripts/check-source-size.ps1
      - name: Test change classifier
        shell: pwsh
        run: ./scripts/test-classify-ci-changes.ps1
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Restore Cargo registry cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: windows-cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-cargo-registry-v3-
            windows-cargo-registry-v2-
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.suite }})
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            arguments: --lib --bin wpt-runner
          - suite: Windows integration
            arguments: >-
              --bin better-web-browser
              --test hostile_input --test html_parser_conformance
              --test live_runtime --test renderer_process
    steps:
      - uses: actions/checkout@v7
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Restore Cargo registry cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: windows-cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-cargo-registry-v3-
            windows-cargo-registry-v2-
      - name: Test
        run: cargo test ${{ matrix.arguments }}

  wpt:
    name: Curated WPT
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Restore Cargo registry cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: windows-cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-cargo-registry-v3-
            windows-cargo-registry-v2-
      - name: Restore pinned WPT fixtures
        id: wpt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\wpt
          key: windows-wpt-${{ hashFiles('tests/wpt/manifest.json') }}
      - name: Prepare pinned WPT fixtures
        shell: pwsh
        run: >-
          ./scripts/checkout-wpt.ps1
          -Destination (Join-Path $env:RUNNER_TEMP 'wpt')
          -VerifyOnly:('${{ steps.wpt-cache.outputs.cache-hit }}' -eq 'true')
      - name: Run curated WPT suite headlessly
        shell: pwsh
        run: ./scripts/run-wpt.ps1 -WptRoot (Join-Path $env:RUNNER_TEMP 'wpt') -BuildProfile debug -Jobs 8

  dependency-policy:
    name: Dependency policy
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: ubuntu-latest
    env:
      # This Ubuntu job and cargo-deny's Alpine container do not include the
      # Windows-worker sccache wrapper configured at workflow scope.
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: 1.95.0
          command: check advisories bans licenses sources
          arguments: --all-features --locked
      - name: Require notices to match the locked Windows release graph
        shell: pwsh
        run: ./scripts/generate-third-party-notices.ps1 -Check

  alpha-compatibility:
    name: Public alpha compatibility
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Restore Cargo registry cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: windows-cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-cargo-registry-v3-
            windows-cargo-registry-v2-
      - name: Run deterministic public-alpha gate headlessly
        shell: pwsh
        run: ./benchmarks/run-alpha.ps1 -Iterations 1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'alpha-compatibility')

  windows:
    name: windows
    if: ${{ always() }}
    needs:
      - changes
      - source
      - lint
      - test
      - wpt
      - alpha-compatibility
      - dependency-policy
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows worker
        shell: bash
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          RUN_WINDOWS: ${{ needs.changes.outputs.run_windows }}
          MARKDOWN_ONLY: ${{ needs.changes.outputs.markdown_only }}
          SOURCE_RESULT: ${{ needs.source.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WPT_RESULT: ${{ needs.wpt.result }}
          ALPHA_RESULT: ${{ needs.alpha-compatibility.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-policy.result }}
        run: |
          if [[ "$CLASSIFICATION_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CLASSIFICATION_RESULT"
            exit 1
          fi

          if [[ "$RUN_WINDOWS" == "false" && "$MARKDOWN_ONLY" == "true" ]]; then
            if [[ "$SOURCE_RESULT" == "skipped" && "$LINT_RESULT" == "skipped" && "$TEST_RESULT" == "skipped" && "$WPT_RESULT" == "skipped" && "$ALPHA_RESULT" == "skipped" && "$DEPENDENCY_RESULT" == "skipped" ]]; then
              echo "Markdown-only pull request: Windows workers were safely skipped."
              exit 0
            fi
            echo "Markdown-only classification had unexpected worker results."
            echo "Source: $SOURCE_RESULT; lint: $LINT_RESULT; test: $TEST_RESULT; WPT: $WPT_RESULT; alpha: $ALPHA_RESULT; dependencies: $DEPENDENCY_RESULT"
            exit 1
          fi

          if [[ "$RUN_WINDOWS" != "true" || "$MARKDOWN_ONLY" != "false" ]]; then
            echo "Invalid change-classification outputs: run_windows='$RUN_WINDOWS', markdown_only='$MARKDOWN_ONLY'"
            exit 1
          fi

          if [[ "$SOURCE_RESULT" != "success" || "$LINT_RESULT" != "success" || "$TEST_RESULT" != "success" || "$WPT_RESULT" != "success" || "$ALPHA_RESULT" != "success" || "$DEPENDENCY_RESULT" != "success" ]]; then
            echo "Source: $SOURCE_RESULT; lint: $LINT_RESULT; test: $TEST_RESULT; WPT: $WPT_RESULT; alpha: $ALPHA_RESULT; dependencies: $DEPENDENCY_RESULT"
            exit 1
          fi
