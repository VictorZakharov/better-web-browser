name: CI

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      run_windows: ${{ steps.classify.outputs.run_windows }}
      markdown_only: ${{ steps.classify.outputs.markdown_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether Windows workers are required
        id: classify
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $parameters = @{ GitHubOutputPath = $env:GITHUB_OUTPUT }
          if ($env:EVENT_NAME -eq 'pull_request') {
            $parameters.BaseSha = $env:BASE_SHA
            $parameters.HeadSha = $env:HEAD_SHA
          } else {
            $parameters.ForceFull = $true
          }
          ./scripts/classify-ci-changes.ps1 @parameters

  linear-history:
    name: Linear PR history
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject merge commits introduced by the pull request
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-linear-history.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA

  source:
    name: Source and formatting
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Enforce source-file size
        shell: pwsh
        run: ./scripts/check-source-size.ps1
      - name: Test change classifier
        shell: pwsh
        run: ./scripts/test-classify-ci-changes.ps1
      - name: Test CI gate and coverage policy
        shell: pwsh
        run: ./scripts/test-ci-policy.ps1
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-rust
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.suite }})
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            arguments: --lib --bin wpt-runner
          - suite: renderer
            # These tests share one AppContainer profile and already take SERIAL.
            arguments: --test renderer_process -- --test-threads=1
          - suite: Windows integration
            arguments: >-
              --bin better-web-browser
              --test hostile_input --test html_parser_conformance
              --test media_process --test fullscreen_layout
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-rust
      - name: Test
        run: cargo test --locked ${{ matrix.arguments }}
      - name: Test bounded hidden-benchmark timeout diagnostics
        if: matrix.suite == 'Windows integration'
        shell: pwsh
        run: ./scripts/test-hidden-benchmark-timeout.ps1 -Browser target/debug/better-web-browser.exe

  live-runtime:
    name: Live browser end-to-end
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-rust
      - name: Test the full browser headlessly
        run: cargo test --locked --test live_runtime

  wpt:
    name: Curated WPT
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-rust
      - name: Restore pinned WPT fixtures
        id: wpt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\wpt
          key: windows-wpt-${{ hashFiles('tests/wpt/manifest.json') }}
      - name: Prepare pinned WPT fixtures
        shell: pwsh
        run: >-
          ./scripts/checkout-wpt.ps1
          -Destination (Join-Path $env:RUNNER_TEMP 'wpt')
          -VerifyOnly:('${{ steps.wpt-cache.outputs.cache-hit }}' -eq 'true')
      - name: Run curated WPT suite headlessly
        shell: pwsh
        run: ./scripts/run-wpt.ps1 -WptRoot (Join-Path $env:RUNNER_TEMP 'wpt') -BuildProfile debug -Jobs 8

  harness:
    name: Chromium harness self-tests
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Test shadow-aware Chromium capture classifier
        run: dotnet run --project benchmarks/chromium-tests/ChromiumBaseline.Tests.csproj -c Release

  dependency-policy:
    name: Dependency policy
    needs: changes
    if: ${{ needs.changes.outputs.run_windows != 'false' }}
    runs-on: ubuntu-latest
    env:
      # This Ubuntu job and cargo-deny's Alpine container do not include the
      # Windows-worker sccache wrapper configured at workflow scope.
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: 1.95.0
          command: check advisories bans licenses sources
          arguments: --all-features --locked
      - name: Require notices to match the locked Windows release graph
        shell: pwsh
        run: ./scripts/generate-third-party-notices.ps1 -Check

  alpha-compatibility:
    name: Public alpha compatibility (${{ matrix.shard }})
    needs: changes
    # Keep the full visual/performance matrix on main, off the PR critical path.
    if: ${{ github.event_name == 'push' && needs.changes.outputs.run_windows != 'false' }}
    runs-on: windows-2022
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-rust
      - name: Build alpha browser
        run: cargo build --locked --bin better-web-browser

      - name: Build Chromium baseline harness
        run: dotnet build benchmarks/chromium/ChromiumBaseline.csproj -c Release
      - name: Run deterministic public-alpha matrix headlessly
        shell: pwsh
        run: ./benchmarks/run-alpha.ps1 -BuildProfile debug -Iterations 1 -ShardIndex ${{ matrix.shard }} -ShardCount 2 -SkipBuild -OutputDirectory (Join-Path $env:RUNNER_TEMP 'alpha-compatibility')

  windows:
    name: windows
    if: ${{ always() }}
    needs:
      - changes
      - source
      - lint
      - test
      - live-runtime
      - wpt
      - alpha-compatibility
      - dependency-policy
      - harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require every worker
        shell: pwsh
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          RUN_WINDOWS: ${{ needs.changes.outputs.run_windows }}
          MARKDOWN_ONLY: ${{ needs.changes.outputs.markdown_only }}
          SOURCE_RESULT: ${{ needs.source.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LIVE_RESULT: ${{ needs.live-runtime.result }}
          WPT_RESULT: ${{ needs.wpt.result }}
          ALPHA_RESULT: ${{ needs.alpha-compatibility.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-policy.result }}
          HARNESS_RESULT: ${{ needs.harness.result }}
        run: |
          ./scripts/assert-ci-results.ps1 -EventName $env:CI_EVENT_NAME -ClassificationResult $env:CLASSIFICATION_RESULT -RunWindows $env:RUN_WINDOWS -MarkdownOnly $env:MARKDOWN_ONLY -Workers @{
            source = $env:SOURCE_RESULT
            lint = $env:LINT_RESULT
            test = $env:TEST_RESULT
            live = $env:LIVE_RESULT
            wpt = $env:WPT_RESULT
            alpha = $env:ALPHA_RESULT
            dependencies = $env:DEPENDENCY_RESULT
            harness = $env:HARNESS_RESULT
          }
