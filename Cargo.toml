[package]
name = "better-web-browser"
version = "0.1.0"
edition = "2024"
description = "A performance-first browser engine MVP"
license = "MIT"

[dependencies]
boa_engine = { version = "0.21.1", default-features = false, features = ["annex-b"] }
boa_gc = "0.21.1"
cssparser = "0.37.0"
data-url = "0.3.2"
encoding_rs = "0.8.35"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
html5ever = "0.39.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[patch.crates-io]
boa_engine = { path = "vendor/boa_engine" }

[lib]
name = "better_web_browser"
path = "src/lib.rs"

[[bin]]
name = "better-web-browser"
path = "src/main.rs"

[[bin]]
name = "wpt-runner"
path = "src/bin/wpt_runner/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

# Optimized local iteration without release LTO's whole-crate rebuild cost. Published binaries and
# benchmark claims continue to use `release`; this profile favors edit/build feedback.
[profile.performance]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
