[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# rav1d's no_std conversion-trait micro-crate: inspected source, no build script
# or dependencies. Accept its CC0 public-domain dedication only at this pin.
exceptions = [{ name = "to_method", version = "=1.1.0", allow = ["CC0-1.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
