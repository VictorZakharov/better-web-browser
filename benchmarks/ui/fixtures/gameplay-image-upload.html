<!doctype html><meta charset="utf-8"><title>pending image uploads</title>
<p>Completed image-source upload workload; the canvas displays the checked texture pixel.</p>
<canvas id="result" width="128" height="128"></canvas>
<script>
(async()=>{
  const gl=document.getElementById('result').getContext('webgl2',{antialias:false,alpha:false});
  if(!gl)throw Error('WebGL 2 unavailable');
  const program=gl.createProgram();
  for(const [kind,source] of [
    [gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}'],
    [gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;uniform sampler2D image;out vec4 color;void main(){color=texelFetch(image,ivec2(0),0);}']
  ]) {
    const shader=gl.createShader(kind);gl.shaderSource(shader,source);gl.compileShader(shader);
    if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));
    gl.attachShader(program,shader);
  }
  gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  const source=new ImageData(256,256),results=[];
  source.data.fill(255);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,256,256,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  for(const flip of [false,true]) {
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,flip);
    const samples=[];
    for(let block=0;block<7;block++) {
      const start=performance.now();
      for(let index=0;index<8;index++) {
        source.data[0]=(index&1)*255;
        source.data[(255*256)*4]=255-source.data[0];
        gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,source);
      }
      gl.finish();
      const elapsed=(performance.now()-start)*1000/8;
      if(block>=2)samples.push(elapsed);
      // Validate the last call's snapshot, including orientation, not just submission.
      source.data.fill(0);gl.drawArrays(gl.TRIANGLES,0,3);
      const pixel=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
      const expected=flip?'0,255,255,255':'255,255,255,255';
      if(pixel.join(',')!==expected || gl.getError()!==0)throw Error('image upload mismatch '+pixel);
      source.data.fill(255);
      await new Promise(resolve=>setTimeout(resolve,0));
    }
    results.push((flip?'flipped':'identity')+':'+samples.map(value=>value.toFixed(1)).join(','));
  }
  document.title='done image-upload us='+results.join(';')+';pixels=checked';
})().catch(error=>{document.title='failed '+error.message;throw error;});
</script>
