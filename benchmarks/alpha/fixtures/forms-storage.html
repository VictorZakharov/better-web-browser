<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Forms and Storage</title><link rel="stylesheet" href="/common.css"></head>
<body><header class="site-header"><h1>Trip preference form</h1><p>Form controls, validation, FormData, and origin storage</p></header><main id="main" class="page"><div class="columns"><form id="preferences" class="panel"><h2>Plan a field visit</h2><label for="name">Name</label><input id="name" name="name" required value="Ada"><label for="region">Region</label><select id="region" name="region"><option>Coast</option><option selected>Forest</option><option>Highland</option></select><label for="notes">Notes</label><textarea id="notes" name="notes">Bring a notebook.</textarea><label><input id="updates" name="updates" type="checkbox" checked> Send local updates</label><button type="submit">Save preferences</button></form><aside class="panel"><h2>Saved state</h2><p id="saved">Nothing saved yet.</p><p class="muted">Storage is reset by the fixture on each load.</p><p id="fixture-status">Loading</p></aside></div></main><footer class="site-footer">All controls remain usable without external services.</footer>
<script>try { localStorage.removeItem('alpha-preferences'); } catch (_) {} document.getElementById('preferences').addEventListener('submit', event => { event.preventDefault(); const value = document.getElementById('region').value; try { localStorage.setItem('alpha-preferences', value); } catch (_) {} document.getElementById('saved').textContent = 'Saved region: ' + value; });</script><script src="/fixture.js"></script></body></html>
