<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Async Mutation Feed</title><link rel="stylesheet" href="/common.css"></head>
<body><header class="site-header"><h1>Activity Stream</h1><p>Timers mutate content, class names, attributes, and layout after first paint</p></header><main id="main" class="page"><section class="hero"><h2>Renderer activity</h2><p id="summary">Waiting for asynchronous updates.</p></section><section id="feed" class="panel"><h2>Events</h2><div class="timeline-item">Initial document parsed.</div></section><p id="fixture-status">Loading</p></main><footer class="site-footer">The settled capture must include all scheduled rows.</footer>
<script>const feed=document.getElementById('feed'); let count=0; const add=()=>{ count++; const row=document.createElement('div'); row.className='timeline-item'; row.setAttribute('data-sequence',String(count)); row.textContent='Asynchronous update '+count+' completed.'; feed.appendChild(row); document.getElementById('summary').textContent=count+' of 6 updates complete.'; if(count<6)setTimeout(add,35); }; setTimeout(add,35);</script><script src="/fixture.js"></script></body></html>
